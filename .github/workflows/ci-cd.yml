name: CI/CD

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest

    env:
      APPWRITE_API_KEY: ci_appwrite_api_key
      BOT_PROTECTION_REQUIRED: "false"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/neon_saloon_ci
      EMAIL_FROM: CI <ci@example.com>
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APPWRITE_DATABASE_ID: lastrodeo
      NEXT_PUBLIC_APPWRITE_ENDPOINT: https://cloud.appwrite.io/v1
      NEXT_PUBLIC_APPWRITE_PROJECT_ID: ci-project
      NEXT_PUBLIC_APPWRITE_PROJECT_NAME: neon-saloon-ci
      NEXT_PUBLIC_APPWRITE_TABLE_GAME_EVENTS: game-events
      NEXT_PUBLIC_APPWRITE_TABLE_GAME_SESSIONS: game-sessions
      NEXT_PUBLIC_PARTYKIT_HOST: 127.0.0.1:1999
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      NEXT_PUBLIC_USE_APPWRITE_REALTIME: "true"
      NEXTAUTH_SECRET: ci-nextauth-secret-minimum-32-characters
      NEXTAUTH_URL: http://localhost:3000
      PARTY_AUTH_SECRET: ci-party-secret-minimum-32-characters
      RATE_LIMIT_KEY_PREFIX: neon-saloon-ci
      RESEND_API_KEY: re_ci
      STRIPE_LIFETIME_PRICE_ID: price_ci_lifetime
      STRIPE_MONTHLY_PRICE_ID: price_ci_monthly
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      UPSTASH_REDIS_REST_TOKEN: ci_upstash_token
      UPSTASH_REDIS_REST_URL: https://ci-upstash.example.com

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit --pretty false

      - name: Build
        run: bun run build

  deploy-partykit:
    name: Deploy PartyKit
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment: production

    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PARTY_AUTH_SECRET: ${{ secrets.PARTY_AUTH_SECRET }}
      PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
      PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check required secrets
        run: |
          test -n "$PARTYKIT_LOGIN"
          test -n "$PARTYKIT_TOKEN"
          test -n "$PARTY_AUTH_SECRET"

      - name: Deploy PartyKit
        run: bunx partykit deploy --var PARTY_AUTH_SECRET="$PARTY_AUTH_SECRET"
